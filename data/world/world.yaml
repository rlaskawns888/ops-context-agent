# 합성 데이터 세계관 (초안)
# 모든 합성 문서는 여기 정의된 이름만 쓴다. 스키마: packages/common/src/common/schema/world.py
# 검증: uv run python scripts/validate_world.py
#
# 의존 체인 (depends_on)
#   VPN → MFA → SSO → AD 계정
#   배포시스템 → 형상관리 → SSO → AD 계정
#   티켓 시스템 → 사내 포털 → SSO → AD 계정
#   망연계 → DRM → SSO → AD 계정
#
# 오류코드 대역: E-1xx VPN, E-2xx MFA, E-3xx SSO, E-4xx AD 계정, E-5xx 메일·그룹웨어,
#   E-6xx DRM·EDR·백신, E-7xx 망연계, E-8xx DB, E-9xx 형상관리·배포·포털·티켓

teams:
  - canonical_name: 보안운영팀
    aliases: [보안운영, 보안팀]
    description: 인증(MFA)·문서보안·단말보안 등 보안 시스템을 운영하고 보안 예외를 심사한다

  - canonical_name: 네트워크팀
    aliases: [네트워크운영팀, 망팀]
    description: VPN·망연계 등 사내 네트워크와 망 분리 구간을 운영한다

  - canonical_name: 인프라운영팀
    aliases: [인프라팀, 시스템운영팀]
    description: 계정 디렉터리·SSO·메일·그룹웨어·사내 포털 등 공통 업무 인프라를 운영한다

  - canonical_name: DB운영팀
    aliases: [DBA팀, DB팀]
    description: 운영DB·개발DB의 계정·권한·백업을 관리한다

  - canonical_name: 개발플랫폼팀
    aliases: [플랫폼팀, DevOps팀]
    description: 형상관리와 배포 파이프라인을 운영한다

  - canonical_name: IT서비스데스크
    aliases: [서비스데스크, 헬프데스크, IT헬프데스크]
    description: 1차 IT 문의 접수와 티켓 시스템을 운영한다

user_groups:
  - canonical_name: 정규직
    aliases: [정규직 직원, 임직원]
    description: 회사와 직접 고용 계약을 맺은 직원

  - canonical_name: 외주
    aliases: [외주 인력, 협력사 인력]
    description: 협력사 소속으로 계약 기간 동안 사내 업무를 수행하는 인력

  - canonical_name: 시스템 관리자
    aliases: [시스템 운영자, 관리자 계정 사용자]
    description: 서버·DB·보안 시스템의 관리자 권한을 가진 운영 담당자

  - canonical_name: 신규 입사자
    aliases: [신입, 신규 직원, 입사자]
    description: 입사 후 30일이 지나지 않은 직원

  - canonical_name: 임원
    aliases: [경영진, 임원진]
    description: 상무 이상 임원

systems:
  - canonical_name: AD 계정
    aliases: [AD, 도메인 계정, 사내 계정]
    owner_team: 인프라운영팀
    depends_on: []
    description: 사내 PC·메일·업무 시스템 로그인에 쓰는 통합 계정 디렉터리

  - canonical_name: SSO
    aliases: [통합 로그인, 통합인증]
    owner_team: 인프라운영팀
    depends_on: [AD 계정]
    description: 한 번 로그인으로 사내 웹 시스템 전체에 접근하게 해 주는 통합 인증 시스템

  - canonical_name: MFA
    aliases: [다중 인증, 2차 인증, OTP 인증]
    owner_team: 보안운영팀
    depends_on: [SSO]
    description: 휴대폰 앱 승인으로 본인을 한 번 더 확인하는 다중 인증 시스템

  - canonical_name: VPN
    aliases: [사내 VPN, 원격접속]
    owner_team: 네트워크팀
    depends_on: [MFA]
    description: 외부에서 사내망에 접속하기 위한 원격접속 시스템

  - canonical_name: 메일
    aliases: [사내 메일, 웹메일, 메일 서버]
    owner_team: 인프라운영팀
    depends_on: [AD 계정]
    description: 사내 메일 송수신 시스템

  - canonical_name: 그룹웨어
    aliases: [GW, 전자결재]
    owner_team: 인프라운영팀
    depends_on: [SSO]
    description: 전자결재·일정·게시판을 제공하는 협업 시스템

  - canonical_name: 사내 포털
    aliases: [포털, 인트라넷, EP]
    owner_team: 인프라운영팀
    depends_on: [SSO]
    description: 사내 공지와 각 업무 시스템 바로가기를 모은 첫 화면

  - canonical_name: 티켓 시스템
    aliases: [ITSM, IT 요청 시스템, 서비스 요청]
    owner_team: IT서비스데스크
    depends_on: [사내 포털]
    description: IT 장애 신고·계정·권한 신청을 접수하고 처리 상태를 관리하는 시스템

  - canonical_name: DRM
    aliases: [문서보안, 문서 암호화]
    owner_team: 보안운영팀
    depends_on: [SSO]
    description: 사내 문서를 자동 암호화하고 열람 권한을 통제하는 문서보안 시스템

  - canonical_name: EDR
    aliases: [엔드포인트 보안, 단말 보안 에이전트]
    owner_team: 보안운영팀
    depends_on: []
    description: PC의 의심 행위를 탐지·차단하는 단말 보안 에이전트

  - canonical_name: 백신
    aliases: [백신 프로그램, 안티바이러스]
    owner_team: 보안운영팀
    depends_on: []
    description: PC의 악성코드를 검사·치료하는 백신 프로그램

  - canonical_name: 망연계
    aliases: [망연계 시스템, 자료전송 시스템, 파일 반출입]
    owner_team: 네트워크팀
    depends_on: [DRM]
    description: 업무망과 인터넷망 사이에서 승인된 파일만 주고받게 하는 자료 전송 시스템

  - canonical_name: 운영DB
    aliases: [운영 데이터베이스, 프로덕션 DB]
    owner_team: DB운영팀
    depends_on: []
    description: 실제 서비스 데이터가 저장된 운영 데이터베이스

  - canonical_name: 개발DB
    aliases: [개발 데이터베이스, 개발계 DB]
    owner_team: DB운영팀
    depends_on: []
    description: 개발·테스트용 데이터베이스

  - canonical_name: 형상관리
    aliases: [Git, 깃, 소스 저장소]
    owner_team: 개발플랫폼팀
    depends_on: [SSO]
    description: 소스코드 버전을 관리하는 Git 저장소 서비스

  - canonical_name: 배포시스템
    aliases: [배포 파이프라인, CI/CD, 배포툴]
    owner_team: 개발플랫폼팀
    depends_on: [형상관리]
    description: 형상관리의 코드를 빌드해 개발계·운영계에 배포하는 시스템

permissions:
  - canonical_name: VPN 접속
    aliases: [VPN 사용 권한, 원격접속 권한]
    on_system: VPN
    risk_level: MEDIUM

  - canonical_name: VPN 해외접속
    aliases: [해외 VPN 접속, 해외 원격접속]
    on_system: VPN
    risk_level: HIGH

  - canonical_name: AD 관리자
    aliases: [도메인 관리자 권한, AD 관리자 권한]
    on_system: AD 계정
    risk_level: HIGH

  - canonical_name: 운영DB READ
    aliases: [운영DB 조회 권한, 운영DB 읽기 권한]
    on_system: 운영DB
    risk_level: MEDIUM

  - canonical_name: 운영DB WRITE
    aliases: [운영DB 쓰기 권한, 운영DB 수정 권한]
    on_system: 운영DB
    risk_level: HIGH

  - canonical_name: 운영DB ADMIN
    aliases: [운영DB 관리자 권한, 운영DB DBA 권한]
    on_system: 운영DB
    risk_level: HIGH

  - canonical_name: 개발DB READ
    aliases: [개발DB 조회 권한]
    on_system: 개발DB
    risk_level: LOW

  - canonical_name: 개발DB WRITE
    aliases: [개발DB 쓰기 권한]
    on_system: 개발DB
    risk_level: MEDIUM

  - canonical_name: 형상관리 READ
    aliases: [Git 읽기 권한, 저장소 조회 권한]
    on_system: 형상관리
    risk_level: LOW

  - canonical_name: 형상관리 WRITE
    aliases: [Git 쓰기 권한, 푸시 권한]
    on_system: 형상관리
    risk_level: MEDIUM

  - canonical_name: 개발계 배포
    aliases: [개발 배포 권한]
    on_system: 배포시스템
    risk_level: LOW

  - canonical_name: 운영계 배포
    aliases: [운영 배포 권한, 프로덕션 배포 권한]
    on_system: 배포시스템
    risk_level: HIGH

  - canonical_name: 망연계 반입
    aliases: [자료 반입 권한, 파일 반입 권한]
    on_system: 망연계
    risk_level: MEDIUM

  - canonical_name: 망연계 반출
    aliases: [자료 반출 권한, 파일 반출 권한]
    on_system: 망연계
    risk_level: HIGH

  - canonical_name: DRM 해제
    aliases: [문서 복호화 권한, DRM 해제 권한]
    on_system: DRM
    risk_level: HIGH

  - canonical_name: 메일 외부발송
    aliases: [외부 메일 발송 권한]
    on_system: 메일
    risk_level: MEDIUM

  - canonical_name: 메일 대용량첨부
    aliases: [대용량 첨부 권한]
    on_system: 메일
    risk_level: LOW

  - canonical_name: 전자결재 관리자
    aliases: [결재 관리자 권한, 그룹웨어 관리자 권한]
    on_system: 그룹웨어
    risk_level: MEDIUM

  - canonical_name: EDR 예외 등록
    aliases: [EDR 예외 권한, 보안 예외 등록]
    on_system: EDR
    risk_level: HIGH

  - canonical_name: 백신 검사 예외
    aliases: [백신 예외 권한, 실시간 감시 예외]
    on_system: 백신
    risk_level: HIGH

  - canonical_name: 티켓 시스템 관리자
    aliases: [ITSM 관리자 권한]
    on_system: 티켓 시스템
    risk_level: MEDIUM

error_codes:
  # VPN
  - code: E-101
    system: VPN
    message: 클라이언트 인증서가 만료되었습니다
    description: VPN 클라이언트에 설치된 접속 인증서의 유효기간이 지나 접속이 거부된다
  - code: E-102
    system: VPN
    message: VPN 서버와의 연결이 끊어졌습니다
    description: 터널 수립 도중 연결이 끊겨 VPN 접속에 실패한다
  - code: E-103
    system: VPN
    message: 동시 접속 세션 수를 초과했습니다
    description: 같은 계정으로 허용된 수보다 많은 기기에서 접속을 시도했다
  - code: E-104
    system: VPN
    message: 허용되지 않은 지역에서의 접속입니다
    description: 해외 등 승인되지 않은 위치에서 접속을 시도해 차단되었다

  # MFA
  - code: E-201
    system: MFA
    message: 승인 요청 시간이 초과되었습니다
    description: 휴대폰 앱의 승인 요청에 제한 시간 안에 응답하지 않았다
  - code: E-202
    system: MFA
    message: 등록된 인증 기기가 없습니다
    description: 계정에 인증 앱이 등록되지 않았거나 기기 변경 후 재등록하지 않았다
  - code: E-203
    system: MFA
    message: 인증 번호가 일치하지 않습니다
    description: 입력한 일회용 인증 번호가 틀렸거나 휴대폰 시간이 어긋나 있다

  # SSO
  - code: E-301
    system: SSO
    message: 인증 토큰이 만료되었습니다. 다시 로그인하세요
    description: 로그인 후 일정 시간이 지나 SSO 토큰이 만료되었다
  - code: E-302
    system: SSO
    message: 로그인 세션 정보를 찾을 수 없습니다
    description: 브라우저 쿠키 삭제 등으로 SSO 세션이 사라졌다
  - code: E-303
    system: SSO
    message: 계정 디렉터리 서버가 응답하지 않습니다
    description: SSO가 AD 계정 디렉터리에 연결하지 못해 로그인 전체가 실패한다

  # AD 계정
  - code: E-401
    system: AD 계정
    message: 비밀번호가 만료되었습니다
    description: 비밀번호 변경 주기(90일)가 지나 새 비밀번호를 설정해야 한다
  - code: E-402
    system: AD 계정
    message: 비활성화된 계정입니다
    description: 장기 미사용·계약 종료 등으로 계정이 비활성화되었다

  # 메일
  - code: E-501
    system: 메일
    message: 메일함 용량이 가득 찼습니다
    description: 할당된 메일함 용량을 초과해 새 메일을 받을 수 없다
  - code: E-502
    system: 메일
    message: 외부 발송이 차단되었습니다
    description: 외부 메일 발송 권한이 없는 계정으로 사외 주소에 메일을 보냈다
  - code: E-503
    system: 메일
    message: 첨부 파일 크기 제한을 초과했습니다
    description: 일반 첨부 한도를 넘는 파일을 첨부했다

  # 그룹웨어
  - code: E-551
    system: 그룹웨어
    message: 결재선을 불러올 수 없습니다
    description: 조직 정보가 동기화되지 않아 결재선 조회에 실패한다
  - code: E-552
    system: 그룹웨어
    message: 문서 양식을 불러오지 못했습니다
    description: 전자결재 양식 로딩 중 오류가 발생했다

  # DRM
  - code: E-601
    system: DRM
    message: 문서 열람 권한이 없습니다
    description: 문서에 지정된 열람 권한 그룹에 사용자가 포함되지 않았다
  - code: E-602
    system: DRM
    message: 문서보안 에이전트가 실행 중이 아닙니다
    description: PC의 DRM 에이전트가 꺼져 있어 암호화 문서를 열 수 없다

  # EDR
  - code: E-631
    system: EDR
    message: 관리 서버와 통신할 수 없습니다
    description: EDR 에이전트가 관리 서버에 정책을 받아오지 못한다
  - code: E-632
    system: EDR
    message: 의심 프로세스가 차단되었습니다
    description: 허용 목록에 없는 프로그램 실행이 EDR에 의해 차단되었다

  # 백신
  - code: E-661
    system: 백신
    message: 엔진 업데이트에 실패했습니다
    description: 백신 엔진이 최신 패턴을 내려받지 못했다

  # 망연계
  - code: E-701
    system: 망연계
    message: 반출 승인이 반려되었습니다
    description: 파일 반출 요청이 승인권자에게 반려되었다
  - code: E-702
    system: 망연계
    message: 허용되지 않은 파일 형식입니다
    description: 실행 파일 등 전송이 금지된 확장자의 파일을 보냈다
  - code: E-703
    system: 망연계
    message: 암호화된 문서는 전송할 수 없습니다
    description: DRM이 적용된 문서를 해제하지 않고 전송하려 했다

  # 운영DB
  - code: E-801
    system: 운영DB
    message: 접속 권한이 없습니다
    description: 운영DB 접속 계정에 해당 스키마 권한이 부여되지 않았다
  - code: E-802
    system: 운영DB
    message: 쿼리 실행 시간이 제한을 초과했습니다
    description: 운영DB 보호를 위한 쿼리 시간 제한에 걸려 실행이 중단되었다

  # 개발DB
  - code: E-851
    system: 개발DB

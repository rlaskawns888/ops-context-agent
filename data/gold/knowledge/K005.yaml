id: K005
title: VPN은 MFA에 의존하고, MFA 인증 실패는 담당인 보안운영팀에 문의한다
scenario_type: multihop
render_as: [slack, minutes]

entities:
  - type: System
    canonical_name: VPN
    aliases: [사내 VPN, 원격접속]
    evidence: VPN에 로그인하면 마지막 단계에서 MFA 인증을 거칩니다.
    description: 외부에서 사내망에 접속하기 위한 원격접속 시스템


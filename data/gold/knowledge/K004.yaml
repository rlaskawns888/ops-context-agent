id: K004
title: 정규직 해외 VPN 접속이 2026년부터 허용에서 사전 승인 필요로 바뀌었다
scenario_type: policy_revision
render_as: [guide, minutes]

# 개정 정책은 canonical_name에 시행일을 붙여 구분한다 (design.md 1.7)
entities:
  - type: UserGroup
    canonical_name: 정규직
    aliases: [정규직 직원, 임직원]

    valid_from: 2025-01-01
    valid_to: 2025-12-31

  - type: Policy
    canonical_name: 해외 VPN 접속 승인 필요 (2026-01-01)
    aliases: [해외 VPN 접속 승인 필요, 해외 VPN 사전 승인]
    evidence: 2026년 1월 1일부터 해외에서 VPN에 접속하려면 출국 전에 보안 담당자의 승인을 받아야 합니다.

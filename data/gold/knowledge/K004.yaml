    description: 외부에서 사내망에 접속하기 위한 원격접속 시스템

  - type: Permission
    canonical_name: VPN 해외접속
    aliases: [해외 VPN 접속, 해외 원격접속]
    evidence: 해외 VPN 접속 권한은 해외에서 사내 VPN으로 내부 시스템을 조회할 수 있는 권한입니다.
    system_name: VPN
    level: READ

  - type: Policy
    canonical_name: 해외 VPN 접속 허용 (2025-01-01)
    aliases: [해외 VPN 접속 허용]

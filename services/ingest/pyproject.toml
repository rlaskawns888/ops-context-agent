[project]
name = "ingest"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "common",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

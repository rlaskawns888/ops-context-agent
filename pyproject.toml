[project]
name = "ops-context-agent"
version = "0.1.0"
description = "사내 IT 운영 Context Agent (모노레포 루트)"
requires-python = "==3.12.*"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]

[dependency-groups]
dev = [
    "faker>=40.63.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.6",
]
scripts = [
    "langfuse>=5.2.0",
    "neo4j>=6.4.1",
    "openai>=3.57.0",
    "psycopg[binary]>=3.3.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "common", "agent_api", "mcp_server", "ops_api", "ingest",
    "generate_gold", "gold_report", "gold_rules", "generate_users",  # scripts/datagen (pytest pythonpath)
    "render_docs", "docs_report", "plan_noise", "render_noise",
]

[tool.pytest.ini_options]
testpaths = ["services", "packages", "scripts"]
pythonpath = ["scripts/datagen"]  # datagen 스크립트끼리·테스트에서 모듈로 import
addopts = "-ra --import-mode=importlib"
